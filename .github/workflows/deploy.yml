# Courstine : dépose un .zip dans le dépôt. Ce workflow le décompresse
# DANS le dépôt (mêmes dossiers que dans le zip), supprime le zip,
# enregistre le tout, puis met le site en ligne sur GitHub Pages.
name: Mettre le zip en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Décompresser le zip dans le dépôt
        id: unzip
        run: |
          set -euo pipefail

          # 1. Le zip ajouté le plus récemment (s'il y en a un)
          ZIP=""; BEST=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$BEST" ]; then BEST=${t:-0}; ZIP="$f"; fi
          done < <(git ls-files -- '*.zip' '*.ZIP')
          if [ -z "$ZIP" ]; then
            echo "Pas de zip : on met en ligne le dépôt tel quel."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Zip utilisé : $ZIP"

          # 2. Décompression dans un dossier temporaire
          EXTRACT="$RUNNER_TEMP/extract"
          rm -rf "$EXTRACT"; mkdir -p "$EXTRACT"
          unzip -q "$ZIP" -d "$EXTRACT"

          # 3. Le dossier qui contient index.html (le moins profond)
          INDEX=$(find "$EXTRACT" -name index.html -not -path '*/__MACOSX/*' \
                  | awk -F/ '{print NF "\t" $0}' | sort -n | head -n1 | cut -f2-)
          if [ -z "$INDEX" ]; then
            echo "::error::Pas de index.html dans $ZIP."
            exit 1
          fi
          SRC=$(dirname "$INDEX")
          rm -rf "$SRC/.github"
          find "$SRC" \( -name '__MACOSX' -o -name '.DS_Store' \) -prune -exec rm -rf {} +

          # 4. Le dépôt prend exactement le contenu du zip
          #    (on garde seulement .git et .github)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. ./

          # 5. Nouveau nom de cache à chaque version,
          #    pour que les téléphones prennent la mise à jour
          if [ -f sw.js ]; then
            sed -i -E "s/(const CACHE = '[^']*)'/\1-build${GITHUB_RUN_NUMBER}'/" sw.js
          fi

          # 6. Enregistrer dans le dépôt
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -m "Décompression de $ZIP"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Vérifier le réglage de GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "none")
          echo "Réglage Pages : $TYPE"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          if [ "$TYPE" = "none" ]; then
            echo "::warning::GitHub Pages n'est pas activé : Settings > Pages > Source = GitHub Actions."
          fi

      # Réglage « GitHub Actions » : on publie directement
      - name: Préparer le site
        if: steps.pages.outputs.type == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
      - name: Envoyer le site
        if: steps.pages.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - name: Mettre en ligne
        id: deployment
        if: steps.pages.outputs.type == 'workflow'
        uses: actions/deploy-pages@v5

      # Réglage « Deploy from a branch » : on demande une reconstruction
      - name: Relancer GitHub Pages (mode branche)
        if: steps.pages.outputs.type == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
